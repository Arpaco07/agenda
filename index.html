<style>
:root{
  --bg:#000; --surface:#111; --surface2:#181818; --surface3:#202020;
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.16);
  --gold:#c9a24a; --gold-soft:rgba(201,162,74,.14);
  --text:#f3f3f3; --dim:#9a9a9a; --dim2:#6b6b6b;
  --green:#5bbf7a; --blue:#4aa3d4; --red:#d46a5a; --gray:#7a7a7a;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- Logo / marca ---------- */
.brand{text-align:center}
.brand .badge{
  width:64px;height:64px;margin:0 auto;border-radius:16px;
  background:linear-gradient(160deg,#1a1a1a,#0a0a0a);
  border:1px solid var(--border2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.brand .badge .p{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:#fff;line-height:1}
.brand .badge .nn{font-size:8px;letter-spacing:1px;color:var(--gold);display:flex;align-items:center;gap:3px;font-weight:600}
.brand .badge .nn svg{width:8px;height:8px}
.brand .name{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;letter-spacing:6px;margin-top:12px;color:#fff}
.brand .sub{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px;color:var(--gold);font-size:12px;letter-spacing:3px;font-weight:600}
.brand .sub .rule{width:32px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.brand .sub .rule.r{transform:scaleX(-1)}

/* ---------- PIN ---------- */
#pin{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:26px}
#pin .cap{color:var(--dim);font-size:13px;letter-spacing:2px;text-transform:uppercase}
.dots{display:flex;gap:16px}
.dots span{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--dim2);transition:.15s}
.dots span.on{background:var(--gold);border-color:var(--gold)}
.dots.err span{border-color:var(--red);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keys button{height:72px;border-radius:50%;background:var(--surface);border:1px solid var(--border);font-size:26px;font-weight:500;color:var(--text);transition:.12s}
.keys button:active{background:var(--surface3);transform:scale(.95)}
.keys button.fn{font-size:15px;background:transparent;border-color:transparent;color:var(--dim)}

/* ---------- App layout ---------- */
#app{max-width:600px;margin:0 auto;padding:0 16px 120px}
header{padding:22px 4px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:linear-gradient(180deg,#000 70%,transparent);z-index:20}
header .badge{width:42px;height:42px;border-radius:12px;background:linear-gradient(160deg,#1a1a1a,#0a0a0a);border:1px solid var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
header .badge .p{font-family:'Cormorant Garamond',serif;font-size:18px;color:#fff;line-height:1}
header .badge .nn{font-size:6px;letter-spacing:.5px;color:var(--gold);font-weight:600}
header .htxt h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.3px}
header .htxt p{margin:1px 0 0;font-size:11px;color:var(--gold);letter-spacing:1.5px;font-weight:500}

.tabs{display:flex;gap:8px;background:var(--surface);padding:5px;border-radius:14px;border:1px solid var(--border);margin-bottom:18px}
.tabs button{flex:1;padding:11px;border-radius:10px;font-weight:600;font-size:14px;color:var(--dim);transition:.15s;display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button svg{width:16px;height:16px}
.tabs button.active{background:var(--surface3);color:var(--gold)}

/* ---------- Date nav ---------- */
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.datenav .arrow{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.datenav .arrow svg{width:18px;height:18px}
.datenav .mid{text-align:center;flex:1}
.datenav .mid .d{font-size:16px;font-weight:600;text-transform:capitalize}
.datenav .mid .c{font-size:12px;color:var(--dim);margin-top:2px}
.todaybtn{display:block;margin:0 auto 18px;padding:7px 18px;border-radius:20px;background:var(--gold-soft);color:var(--gold);font-size:12px;font-weight:600;letter-spacing:.5px}

/* ---------- Reservation cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:12px;position:relative;overflow:hidden}
.card.st-cancelada{opacity:.55}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.card .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card .hora{font-size:20px;font-weight:700;letter-spacing:-.3px}
.card .hora small{font-size:12px;font-weight:600;color:var(--dim);margin-left:2px}
.card .nombre{font-size:16px;font-weight:600;margin:2px 0 0}
.chip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;letter-spacing:.3px;white-space:nowrap}
.chip.zona{background:var(--surface3);color:var(--dim);border:1px solid var(--border)}
.chip.zona.priv{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.estado{font-size:11px;font-weight:600;padding:5px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
.estado .dot{width:6px;height:6px;border-radius:50%}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:11px;font-size:13px;color:var(--dim)}
.meta .m{display:flex;align-items:center;gap:6px}
.meta .m svg{width:14px;height:14px;color:var(--dim2);flex-shrink:0}
.meta .m.gold{color:var(--gold)}
.meta .m.gold svg{color:var(--gold)}
.note{margin-top:9px;font-size:13px;color:var(--dim);background:var(--surface2);border-radius:10px;padding:8px 11px;border-left:2px solid var(--border2)}
.actions{display:flex;gap:8px;margin-top:13px;padding-top:13px;border-top:1px solid var(--border)}
.actions button{flex:1;padding:9px;border-radius:10px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:6px;transition:.12s}
.actions button:active{background:var(--surface3)}
.actions button svg{width:15px;height:15px}
.actions button.wa{color:var(--green)}
.actions button.est{color:var(--gold)}

.empty{text-align:center;padding:60px 20px;color:var(--dim2)}
.empty .big{font-size:15px;color:var(--dim);margin-bottom:6px;font-weight:500}
.loader{text-align:center;padding:50px;color:var(--dim2);font-size:14px}

/* ---------- Calendar ---------- */
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calnav .m{font-size:17px;font-weight:600;text-transform:capitalize}
.calnav .arrow{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.calnav .arrow svg{width:18px;height:18px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow span{text-align:center;font-size:11px;color:var(--dim2);font-weight:600;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;transition:.12s}
.cell.empty-cell{background:transparent;border-color:transparent}
.cell:active{background:var(--surface3)}
.cell .num{font-size:14px;font-weight:600;color:var(--text)}
.cell.today{border-color:var(--gold)}
.cell.today .num{color:var(--gold)}
.cell .cnt{font-size:10px;font-weight:700;background:var(--gold);color:#000;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.cell.has .num{margin-top:-2px}

/* ---------- FAB ---------- */
.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;font-weight:700;font-size:15px;padding:15px 26px;border-radius:30px;display:flex;align-items:center;gap:9px;box-shadow:0 8px 30px rgba(201,162,74,.35);z-index:30}
.fab svg{width:19px;height:19px}
.fab:active{transform:translateX(-50%) scale(.96)}

/* ---------- Modal / form ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:24px 24px 0 0;border:1px solid var(--border);border-bottom:none;max-height:92vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:38px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 4px}
.sheet .head{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 16px}
.sheet .head h2{font-size:18px;margin:0;font-weight:600}
.sheet .head .x{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.sheet .head .x svg{width:16px;height:16px}
.form{padding:0 20px 24px;display:flex;flex-direction:column;gap:15px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:7px;font-weight:600;letter-spacing:.3px}
.field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--text);transition:.12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);outline:none}
.field textarea{resize:vertical;min-height:60px}
.two{display:flex;gap:12px}
.two .field{flex:1}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:13px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-weight:600;color:var(--dim);transition:.12s}
.seg button.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.inpmoney{position:relative}
.inpmoney span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim);font-weight:600}
.inpmoney input{padding-left:28px}
.save{margin-top:6px;background:var(--gold);color:#000;font-weight:700;font-size:16px;padding:15px;border-radius:14px;transition:.12s}
.save:active{transform:scale(.98)}
.save:disabled{opacity:.5}

/* estado sheet */
.estlist{padding:4px 16px 26px;display:flex;flex-direction:column;gap:8px}
.estlist button{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);font-size:15px;font-weight:600;text-align:left}
.estlist button:active{background:var(--surface3)}
.estlist button .dot{width:10px;height:10px;border-radius:50%}
.estlist button.del{color:var(--red);justify-content:center}
.estlist button.del svg{width:16px;height:16px}

/* toast */
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface3);border:1px solid var(--border2);color:var(--text);padding:12px 20px;border-radius:24px;font-size:14px;font-weight:500;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--red);color:#ffb3a8}

footer{text-align:center;color:var(--dim2);font-size:11px;padding:24px 0 8px;letter-spacing:.5px}
.brand .badge img,header .badge img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
</style>
</head>

async function sbGet(q){const r=await fetch(SB_URL+'/rest/v1/reservas?'+q,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbIns(o){const r=await fetch(SB_URL+'/rest/v1/reservas',{method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify(o)});if(!r.ok)throw new Error(await r.text());return r.json();}

async function sbDel(id){const r=await fetch(SB_URL+'/rest/v1/reservas?id=eq.'+id,{method:'DELETE',headers:H});if(!r.ok)throw new Error(await r.text());}

function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function toStr(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function todayStr(){return toStr(new Date());}
function shiftDate(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return toStr(d);}
function fmtLong(s){const d=parseD(s);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()];}
function fmtShort(s){const d=parseD(s);return DIAS_C[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()].slice(0,3);}
function fmt12(h){if(!h)return'';let[H1,M]=h.split(':');H1=parseInt(H1,10);const ap=H1>=12?'p.m.':'a.m.';let hh=H1%12;if(hh===0)hh=12;return hh+':'+M+' '+ap;}

}

  if(buf.length>=4)return;

}

  money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
  gift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.6.1-.2.3-.7.9-.8 1-.1.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.6-1.5-.9-2c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-1 .9-1 2.3s1 2.7 1.1 2.9c.1.2 2 3 4.8 4.2.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 2-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3z M12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 1 1-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>'
};

async function loadLista(){
  document.getElementById('ld-day').textContent=(selDate===todayStr()?'Hoy · ':'')+fmtShort(selDate);
  const el=document.getElementById('lista');
  el.innerHTML='<div class="loader">Cargando…</div>';
  try{
    const rows=await sbGet('fecha=eq.'+selDate+'&order=hora.asc');
    curRows={};rows.forEach(r=>curRows[r.id]=r);
    document.getElementById('ld-count').textContent=rows.length?(rows.length+' '+(rows.length===1?'reserva':'reservas')):'';
    if(!rows.length){el.innerHTML='<div class="empty"><div class="big">Sin reservas este día</div>Toca “Nueva reserva” para agregar una.</div>';return;}
    el.innerHTML=rows.map(cardHtml).join('');
  }catch(e){el.innerHTML='<div class="empty"><div class="big">No se pudo cargar</div>Revisa tu internet e intenta de nuevo.</div>';}
}

function cardHtml(r){
  const es=EST[r.estado]||EST.pendiente;
  const priv=r.zona==='privado';
  const wa=waLink(r);
  return `<div class="card st-${r.estado}">
    <div class="bar" style="background:${es.c}"></div>
    <div class="row1">
      <div>
        <div class="hora">${fmt12(r.hora)}</div>
        <div class="nombre">${esc(r.nombre)}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        <span class="chip zona ${priv?'priv':''}">${priv?'Privado':'Piso'}</span>
        <span class="estado" style="background:${es.c}22;color:${es.c}"><span class="dot" style="background:${es.c}"></span>${es.l}</span>
      </div>
    </div>
    <div class="meta">
      <div class="m">${ic.users}${r.personas||'—'} personas</div>
      ${r.telefono?`<div class="m">${ic.phone}${esc(r.telefono)}</div>`:''}
      ${r.ocasion?`<div class="m gold">${ic.gift}${esc(r.ocasion)}</div>`:''}
      ${Number(r.anticipo)>0?`<div class="m gold">${ic.money}Anticipo ${money(r.anticipo)}</div>`:''}
    </div>
    ${r.notas?`<div class="note">${esc(r.notas)}</div>`:''}
    <div class="actions">
      <button class="est" onclick="openEstado('${r.id}')">${ic.tag}Estado</button>
      ${wa?`<button class="wa" onclick="openWa('${r.id}')">${ic.wa}WhatsApp</button>`:''}
      <button onclick="openFormId('${r.id}')">${ic.edit}Editar</button>
    </div>
  </div>`;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function waLink(r){
  if(!r.telefono)return null;
  let d=r.telefono.replace(/\D/g,'');
  if(d.length===10)d='52'+d;
  if(d.length<11)return null;
  const msg=`Hola ${r.nombre}, le confirmamos su reserva en Los Pares 84×88 para el ${fmtLong(r.fecha)} a las ${fmt12(r.hora)}, para ${r.personas||''} personas. ¡Le esperamos!`;
  return 'https://wa.me/'+d+'?text='+encodeURIComponent(msg);
}

/* ================= CALENDARIO ================= */
async function loadCal(){
  document.getElementById('cal-month').textContent=MESES[calM]+' '+calY;
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  const first=new Date(calY,calM,1);
  const offset=(first.getDay()+6)%7; // lunes=0
  const days=new Date(calY,calM+1,0).getDate();
  const mm=String(calM+1).padStart(2,'0');
  let counts={};
  try{
    const rows=await sbGet('fecha=gte.'+calY+'-'+mm+'-01&fecha=lte.'+calY+'-'+mm+'-'+days+'&select=fecha');
    rows.forEach(r=>counts[r.fecha]=(counts[r.fecha]||0)+1);
  }catch(e){}
  for(let i=0;i<offset;i++){const c=document.createElement('div');c.className='cell empty-cell';grid.appendChild(c);}
  const today=todayStr();
  for(let d=1;d<=days;d++){
    const ds=calY+'-'+mm+'-'+String(d).padStart(2,'0');
    const n=counts[ds]||0;
    const cell=document.createElement('div');
    cell.className='cell'+(n?' has':'')+(ds===today?' today':'');
    cell.innerHTML=`<span class="num">${d}</span>`+(n?`<span class="cnt">${n}</span>`:'');
    cell.onclick=()=>{selDate=ds;setView('lista');};
    grid.appendChild(cell);
  }
}

/* ================= FORM ================= */
function openFormId(id){openForm(curRows[id]);}
function openWa(id){const u=waLink(curRows[id]);if(u)window.open(u,'_blank');}
function openForm(r){
  editing=r&&r.id?r.id:null;
  const zona=r&&r.zona?r.zona:'piso';
  const estado=r&&r.estado?r.estado:'pendiente';
  const ov=document.createElement('div');ov.className='overlay';ov.id='formOv';
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.innerHTML=`<div class="sheet">
    <div class="grab"></div>
    <div class="head"><h2>${editing?'Editar reserva':'Nueva reserva'}</h2>
      <button class="x" onclick="document.getElementById('formOv').remove()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="form">
      <div class="field"><label>Nombre del cliente</label><input id="f-nombre" value="${r?esc(r.nombre):''}" placeholder="Nombre y apellido"></div>
      <div class="two">
        <div class="field"><label>Fecha</label><input id="f-fecha" type="date" value="${r?r.fecha:selDate}"></div>
        <div class="field"><label>Hora</label><input id="f-hora" type="time" value="${r&&r.hora?r.hora.slice(0,5):'20:00'}"></div>
      </div>
      <div class="two">
        <div class="field"><label>Personas</label><input id="f-personas" type="number" min="1" value="${r&&r.personas?r.personas:''}" placeholder="0"></div>
        <div class="field"><label>Teléfono</label><input id="f-tel" type="tel" value="${r&&r.telefono?esc(r.telefono):''}" placeholder="10 dígitos"></div>
      </div>
      <div class="field"><label>Zona</label>
        <div class="seg" id="f-zona">
          <button type="button" class="${zona==='piso'?'on':''}" data-z="piso">Piso</button>
          <button type="button" class="${zona==='privado'?'on':''}" data-z="privado">Privado</button>
        </div>
      </div>
      <div class="field"><label>Ocasión / tipo de reunión</label><input id="f-ocasion" value="${r&&r.ocasion?esc(r.ocasion):''}" placeholder="Cumpleaños, reunión de trabajo…"></div>
      <div class="field"><label>Notas / preferencias</label><textarea id="f-notas" placeholder="Cerca del área de niños, lejos de la puerta, pastel, etc.">${r&&r.notas?esc(r.notas):''}</textarea></div>
      <div class="field"><label>Anticipo / depósito</label><div class="inpmoney"><span>$</span><input id="f-anticipo" type="number" min="0" step="any" value="${r&&Number(r.anticipo)>0?r.anticipo:''}" placeholder="0"></div></div>
      <div class="field"><label>Estado</label>
        <select id="f-estado">
          ${Object.keys(EST).map(k=>`<option value="${k}" ${estado===k?'selected':''}>${EST[k].l}</option>`).join('')}
        </select>
      </div>
      <button class="save" id="f-save" onclick="saveForm()">${editing?'Guardar cambios':'Guardar reserva'}</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelectorAll('#f-zona button').forEach(b=>b.onclick=()=>{
    ov.querySelectorAll('#f-zona button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  });
}

async function saveForm(){
  const g=id=>document.getElementById(id);
  const nombre=g('f-nombre').value.trim();
  const fecha=g('f-fecha').value;
  const hora=g('f-hora').value;
  if(!nombre){toast('Escribe el nombre del cliente',true);return;}
  if(!fecha||!hora){toast('Falta la fecha o la hora',true);return;}
  const zonaBtn=document.querySelector('#f-zona button.on');
  const obj={
    nombre,fecha,hora,
    personas:parseInt(g('f-personas').value)||null,
    telefono:g('f-tel').value.trim()||null,
    zona:zonaBtn?zonaBtn.dataset.z:'piso',
    ocasion:g('f-ocasion').value.trim()||null,
    notas:g('f-notas').value.trim()||null,
    anticipo:parseFloat(g('f-anticipo').value)||0,
    estado:g('f-estado').value
  };
  const btn=g('f-save');btn.disabled=true;btn.textContent='Guardando…';
  try{
    if(editing)await sbUpd(editing,obj);else await sbIns(obj);
    document.getElementById('formOv').remove();
    toast(editing?'Reserva actualizada':'Reserva guardada');
    selDate=fecha;
    if(view==='lista')loadLista();else loadCal();
  }catch(e){btn.disabled=false;btn.textContent='Guardar reserva';toast('No se pudo guardar',true);}
}

/* ================= ESTADO / BORRAR ================= */
function openEstado(id){
  const ov=document.createElement('div');ov.className='overlay';ov.id='estOv';
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.innerHTML=`<div class="sheet">
    <div class="grab"></div>
    <div class="head"><h2>Estado de la reserva</h2>
      <button class="x" onclick="document.getElementById('estOv').remove()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="estlist">
      ${Object.keys(EST).map(k=>`<button onclick="setEstado('${id}','${k}')"><span class="dot" style="background:${EST[k].c}"></span>${EST[k].l}</button>`).join('')}
      <button class="del" onclick="delReserva('${id}')">${ic.trash}Eliminar reserva</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
}
async function setEstado(id,est){
  try{await sbUpd(id,{estado:est});document.getElementById('estOv').remove();toast('Estado: '+EST[est].l);loadLista();}
  catch(e){toast('No se pudo cambiar',true);}
}
async function delReserva(id){
  if(!confirm('¿Eliminar esta reserva? No se puede deshacer.'))return;
  try{await sbDel(id);const o=document.getElementById('estOv');if(o)o.remove();toast('Reserva eliminada');loadLista();}
  catch(e){toast('No se pudo eliminar',true);}
}

/* ================= TOAST ================= */
let tT;
function toast(msg,err){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='show'+(err?' err':'');
  clearTimeout(tT);tT=setTimeout(()=>t.className='',2600);
}
</script>
</body>
</html>
